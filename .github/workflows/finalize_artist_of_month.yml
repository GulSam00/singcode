name: Finalize Artist of the Month

on:
  schedule:
    # 매일 00:10 KST(UTC 15:10) 실행. finalize API는 "지난달" 결과만 계산해 덮어쓰므로
    # 하루에 한 번 이상 돌아도 안전하다 — GitHub Actions cron 지연으로 자정 실행을 놓치는 상황에 대비한다.
    - cron: "10 15 * * *"
  workflow_dispatch:

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Call finalize API
        run: |
          curl --fail --silent --show-error \
            -X POST "https://www.singcode.kr/api/artist-vote/finalize" \
            -H "Authorization: Bearer ${{ secrets.ARTIST_VOTE_FINALIZE_SECRET }}"
